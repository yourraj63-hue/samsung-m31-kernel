name: 100% Fixed Ultra-Automatic Shitanshu Kernel for M31

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # सुरक्षित और पुराने स्थिर बिल्ड एनवायरनमेंट के लिए डॉकर कंटेनर का उपयोग
    container:
      image: ghcr.io/sushrut111/ubuntu:20.04
      
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Pre-Setup Dependencies
      run: |
        apt-get update && apt-get install -y wget zip unzip libssl-dev bc bison flex make gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Auto-Detect Defconfig & Inject Name
      run: |
        cd arch/arm64/configs/
        # Exynos 9611 के सबसे कॉमन defconfigs को ऑटो-डिटेक्ट करना
        if [ -f exynos9610-m31nsxx_defconfig ]; then
            DEFCONFIG="exynos9610-m31nsxx_defconfig"
        elif [ -f universal9611_q_launching_defconfig ]; then
            DEFCONFIG="universal9611_q_launching_defconfig"
        elif [ -f m31_00_defconfig ]; then
            DEFCONFIG="m31_00_defconfig"
        else
            DEFCONFIG=$(ls *defconfig | head -n 1)
        fi
        
        echo "Detected Defconfig: $DEFCONFIG"
        cd $GITHUB_WORKSPACE
        
        # लोकल कर्नल वर्जन नेम में "-Shitanshu" जोड़ना
        echo "CONFIG_LOCALVERSION=\"-Shitanshu\"" >> arch/arm64/configs/$DEFCONFIG
        echo "TARGET_DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
        
        # कर्नल वर्जन इन्फो में आपका नाम सेट करना
        echo "KBUILD_BUILD_USER=Shitanshu" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=Android" >> $GITHUB_ENV

    - name: Build Kernel (GCC Stable Architecture)
      run: |
        make O=out ARCH=arm64 $TARGET_DEFCONFIG
        
        make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"

    - name: Check Kernel Output
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
            echo "Kernel built successfully with Image.gz-dtb!"
        elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
            echo "Kernel built successfully with standard Image!"
        else
            echo "Build failed! No Kernel Image found."
            exit 1
        fi

    - name: Pack with AnyKernel3 (Flashable ZIP)
      run: |
        cd $GITHUB_WORKSPACE
        wget -q https://github.com -O anykernel.zip
        unzip -q anykernel.zip
        mv AnyKernel3-master AnyKernel
        cd AnyKernel
        
        # M31 (Exynos 9611) के लिए यूनिवर्सल डिवाइस चेक बायपास और ब्लॉक पाथ सेट करना
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' anykernel.sh
        
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/$KERNEL_IMAGE .
        
        if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb_exynos.img ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb_exynos.img dtb
        fi
        if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo_exynos.img ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo_exynos.img dtbo
        fi
        
        zip -r9 $GITHUB_WORKSPACE/Shitanshu-CustomKernel-M31.zip * -x .git README.md

    - name: Upload Flashable Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Shitanshu-Kernel-M31
        path: ${{ github.workspace }}/Shitanshu-CustomKernel-M31.zip
