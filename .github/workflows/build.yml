name: Fully Automatic Shitanshu Kernel Build for M31

on:
  workflow_dispatch: # GitHub Actions टैब में "Run workflow" बटन से चलाने के लिए

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Download Proton/AOSP Clang Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/tc
        cd $GITHUB_WORKSPACE/tc
        # Exynos 9611 कर्नल के लिए AOSP Clang डाउनलोड कर रहा है
        curl -LO https://googlesource.com
        tar -xf clang-r522817.tar.gz
        rm clang-r522817.tar.gz

    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/tc/bin:$PATH" >> $GITHUB_ENV
        # कर्नल वर्जन इन्फो में आपका नाम और होस्ट नेम
        echo "KBUILD_BUILD_USER=Shitanshu" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=Android" >> $GITHUB_ENV

    - name: Auto-Detect Defconfig & Inject Name
      run: |
        cd arch/arm64/configs/
        # M31/Exynos9611 के सबसे कॉमन defconfigs को ऑटो-डिटेक्ट करना
        if [ -f exynos9610-m31nsxx_defconfig ]; then
            DEFCONFIG="exynos9610-m31nsxx_defconfig"
        elif [ -f universal9611_q_launching_defconfig ]; then
            DEFCONFIG="universal9611_q_launching_defconfig"
        elif [ -f m31_00_defconfig ]; then
            DEFCONFIG="m31_00_defconfig"
        else
            # अगर ऊपर का कोई नाम मैच नहीं हुआ, तो जो भी defconfig फ़ोल्डर में उपलब्ध है उसे चुन लेगा
            DEFCONFIG=$(ls *defconfig | head -n 1)
        fi
        
        echo "Detected Defconfig: $DEFCONFIG"
        cd $GITHUB_WORKSPACE
        
        # ऑटोमैटिक कर्नल वर्जन में "-Shitanshu" नाम जोड़ना
        echo "CONFIG_LOCALVERSION=\"-Shitanshu\"" >> arch/arm64/configs/$DEFCONFIG
        echo "TARGET_DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        make O=out ARCH=arm64 $TARGET_DEFCONFIG
        
        make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"

    - name: Check Kernel Output
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> $GITHUB_ENV
            echo "Kernel built successfully with Image.gz-dtb!"
        elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
            echo "Kernel built successfully with standard Image!"
        else
            echo "Build failed! No Kernel Image found."
            exit 1
        fi

    - name: Pack with AnyKernel3 (Fully Automatic ZIP)
      run: |
        cd $GITHUB_WORKSPACE
        # AnyKernel3 स्क्रिप्ट क्लोन करना
        git clone https://github.com AnyKernel
        cd AnyKernel
        
        # M31 (Exynos 9611) के लिए यूनिवर्सल डिवाइस चेक बायपास और ब्लॉक पाथ सेट करना
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' anykernel.sh
        
        # कर्नल इमेज फ़ाइल को यहाँ कॉपी करना (चाहे वह Image हो या Image.gz-dtb)
        cp $GITHUB_WORKSPACE/out/arch/arm64/boot/$KERNEL_IMAGE .
        
        # अगर कर्नल को dtb या dtbo फ़ाइलों की ज़रूरत है, तो उन्हें भी उठा लेगा
        if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb_exynos.img ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb_exynos.img dtb
        fi
        if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo_exynos.img ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo_exynos.img dtbo
        fi
        
        # फ़्लैश होने वाली ज़िप फ़ाइल तैयार करना
        zip -r9 $GITHUB_WORKSPACE/Shitanshu-CustomKernel-M31.zip * -x .git README.md

    - name: Upload Flashable Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Shitanshu-Kernel-M31
        path: ${{ github.workspace }}/Shitanshu-CustomKernel-M31.zip
